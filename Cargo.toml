[package]
name = "mp3-organizer"
version = "0.0.1"
description = "Guesses the missing ID3 tags for artist, album and title from filename then moves properly tagged mp3 files into subfolders: <Artist>/<Album>/<Filename>"
readme = "README.md"
homepage = "https://crates.io/crates/mp3-organizer"
license = "MIT OR Apache-2.0"
edition = "2024"
autoexamples = false
autobenches = false
documentation = "https://docs.rs/mp3-organizer"
repository = "https://github.com/gabrielfalcao/mp3-organizer"

keywords = ["mp3", "id3", "tagging", "music", "audio"]
authors = ["Gabriel DeMoura <gabrielteratos@gmail.com>"]
categories = ["command-line-interface", "multimedia::audio"]
default-run = "mp3-organizer"

# categories = [] # https://crates.io/category_slugs


[package.metadata]
targets = [
    # "aarch64-apple-darwin",
    # "x86_64-unknown-linux-gnu",
    # "aarch64-unknown-linux-gnu",
]

[profile.release] # https://github.com/johnthagen/min-sized-rust
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size. https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level
lto = true
panic = "abort"
codegen-units = 1
# https://github.com/johnthagen/min-sized-rust?tab=readme-ov-file#remove-fmtdebug



[lib]
name = "mp3_organizer"
path = "src/lib.rs"

doctest = false
bench = false


[[bin]]
name = "mp3-organizer"
path = "src/bin/mp3-organizer.rs"
doctest = false
bench = false
doc = false
test = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "string", "unicode", "wrap_help"] }
color-eyre = "0.6.5"
crc = "3.4.0"
fern = { version = "0.7.1", features = ["colored", "chrono"] }
id3 = "1.17.2"
iocore = { version = "3.2.0", features = ["walk-glob"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.12.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
